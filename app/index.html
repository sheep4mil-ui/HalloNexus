<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HallowNexus IDE</title>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #111216; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .top-bar {
      height: 40px; background-color: #1a1c23; border-bottom: 1px solid #2d3139;
      display: flex; align-items: center; padding: 0 15px; gap: 10px;
    }
    .btn {
      background-color: #2d3139; color: #e2e8f0; border: none;
      padding: 5px 12px; font-size: 12px; border-radius: 4px; cursor: pointer;
    }
    .btn:hover { background-color: #3e4450; }
    .btn-primary { background-color: #4f46e5; }
    .btn-primary:hover { background-color: #6366f1; }
    .workspace-container { display: flex; flex: 1; height: calc(100vh - 40px); position: relative; }
    
    /* 🪐 DYNAMIC SCROLLABLE TOOLBOX DRAWER VIEWPORT styling */
    .panel-toolbox {
      width: 260px; background-color: #16181f; border-right: 1px solid #2d3139;
      display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; z-index: 10;
      overflow-y: auto; /* Activates pure CSS scroll bar mechanics when tabs stack up */
    }
    /* Sleek custom scrollbar profiles to match the dark HallowNexus theme */
    .panel-toolbox::-webkit-scrollbar { width: 6px; }
    .panel-toolbox::-webkit-scrollbar-track { background: #111216; }
    .panel-toolbox::-webkit-scrollbar-thumb { background: #2d3139; border-radius: 3px; }
    .panel-toolbox::-webkit-scrollbar-thumb:hover { background: #4f46e5; }

    .panel-canvas { flex: 1; background-color: #0b0c10; position: relative; overflow: hidden; }
    .canvas-grid {
      position: absolute; width: 5000px; height: 5000px;
      background-image: 
        linear-gradient(to right, #1b1d24 1px, transparent 1px),
        linear-gradient(to bottom, #1b1d24 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .node-card { user-select: none !important; -webkit-user-select: none !important; }
    .socket-flash-confirm { animation: socketFlashLoop 0.3s ease-in-out 3; }
    @keyframes socketFlashLoop {
      0%, 100% { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
      50% { background-color: #1a1c23; box-shadow: none; }
    }
    .panel-desk { width: 320px; background-color: #16181f; border-left: 1px solid #2d3139; display: flex; flex-direction: column; box-sizing: border-box; z-index: 10; }
    .desk-section { padding: 15px; border-bottom: 1px solid #2d3139; }
    .desk-section:last-child { border-bottom: none; flex: 1; }
    .ai-terminal {
      background-color: #0b0c10; border: 1px solid #2d3139; border-radius: 4px;
      height: 180px; padding: 10px; font-family: monospace; font-size: 12px; color: #38bdf8; overflow-y: auto; margin-bottom: 10px;
    }
    body.squish-active .panel-toolbox { display: none; }
    body.squish-active .panel-emulator { width: 320px; border-right: 1px solid #2d3139; }
    .panel-emulator { width: 0; background-color: #111216; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: monospace; color: #a78bfa; }

    .canvas-hotbar-overlay {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background-color: #16181f; border: 2px solid #2d3139; border-radius: 8px;
      padding: 6px 12px; display: flex; gap: 8px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .hotbar-slot {
      width: 44px; height: 44px; background-color: #0b0c10; border: 1px dashed #475569;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      position: relative; font-size: 11px; font-weight: bold; color: #64748b; cursor: pointer; transition: all 0.15s ease;
    }
    .hotbar-slot:hover { border-color: #4f46e5; background-color: #12131a; color: #a78bfa; }
    .hotbar-slot.slot-occupied { border-style: solid; border-color: #4f46e5; background-color: #212430; color: #e2e8f0; }
    .hotbar-key-index { position: absolute; top: 2px; left: 4px; font-size: 9px; color: #475569; }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="btn btn-primary" id="btn-squish">Switch Emulator</button>
    <button class="btn" id="btn-clean">⚙️ Compile Project</button>
    <button class="btn" id="btn-open-sprite-drawer" style="background-color: #16a34a; margin-left: 10px;">🎨 Draw Textures</button>
  </div>
  <div class="workspace-container">
    <div class="panel-emulator" id="emulator-window">[CE_EMULATOR_SCREEN]</div>
    
    <!-- Left Category Panel Box Container Core -->
    <div class="panel-toolbox" id="toolbox">
      <h3>Toolbox</h3>
      <p style="font-size: 12px; color: #64748b; margin-bottom: 15px;">Click accordion categories to open logic drawers.</p>
    </div>
    
    <div class="panel-canvas" id="canvas-viewport">
      <div class="canvas-grid" id="canvas-grid-layer"></div>
      
      <div class="canvas-hotbar-overlay" id="nexus-canvas-hotbar">
        <div class="hotbar-slot" data-slot="1"><span class="hotbar-key-index">1</span>-</div>
        <div class="hotbar-slot" data-slot="2"><span class="hotbar-key-index">2</span>-</div>
        <div class="hotbar-slot" data-slot="3"><span class="hotbar-key-index">3</span>-</div>
        <div class="hotbar-slot" data-slot="4"><span class="hotbar-key-index">4</span>-</div>
        <div class="hotbar-slot" data-slot="5"><span class="hotbar-key-index">5</span>-</div>
        <div class="hotbar-slot" data-slot="6"><span class="hotbar-key-index">6</span>-</div>
        <div class="hotbar-slot" data-slot="7"><span class="hotbar-key-index">7</span>-</div>
        <div class="hotbar-slot" data-slot="8"><span class="hotbar-key-index">8</span>-</div>
      </div>
    </div>

    <div class="panel-desk">
      <div class="desk-section">
        <h3>Telemetry</h3>
        <div style="font-size: 13px; font-family: monospace; line-height: 1.6;">
          CPU Overhead: <span style="color: #4ade80;">11%</span><br>
          Unallocated RAM: <span style="color: #4ade80;">4.2KB</span><br>
          VRAM Execution: <span style="color: #4ade80;">60 FPS</span>
        </div>
      </div>
      <div class="desk-section" style="display: flex; flex-direction: column;">
        <h3>Ollama Core</h3>
        <div class="ai-terminal" id="ai-logs">HallowNexus Engine online.<br>Ollama link ready.</div>
        <input type="text" id="ollama-input" placeholder="Ask Ollama to clean wire graph..." style="background-color: #0b0c10; border: 1px solid #2d3139; color: #e2e8f0; padding: 8px; border-radius: 4px; font-size: 13px;">
      </div>
    </div>
  </div>
  
  <script src="sprite-editor.js"></script>
  <script src="nexus-emulator.js"></script>
  <script src="canvas-nodes.js"></script>
  <script src="wire-linker.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
